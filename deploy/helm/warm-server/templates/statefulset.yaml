{{- if not (or .Values.auth.existingSecret .Values.auth.apiKey) -}}
{{- fail "warm-server needs credentials: set auth.existingSecret (keys WARM_API_KEY and/or keys.json) or auth.apiKey" -}}
{{- end -}}
{{- $scheme := ternary "HTTPS" "HTTP" (not (empty .Values.tls.existingSecret)) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "warm-server.fullname" . }}
  labels:
    {{- include "warm-server.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "warm-server.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "warm-server.selectorLabels" . | nindent 6 }}
  {{- if and .Values.persistence.enabled }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  template:
    metadata:
      annotations:
        {{- if .Values.auth.apiKey }}
        checksum/auth: {{ .Values.auth.apiKey | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "warm-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "warm-server.serviceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: warm-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: WARM_BIND
              value: "0.0.0.0:8080"
            - name: WARM_DATA_DIR
              value: /data
            {{- range $name, $value := .Values.config }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            - name: WARM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "warm-server.authSecret" . }}
                  key: WARM_API_KEY
                  optional: {{ .Values.auth.keysFile }}
            {{- if .Values.auth.keysFile }}
            - name: WARM_KEYS_FILE
              value: /etc/warm/keys/keys.json
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: WARM_TLS_CERT
              value: /etc/warm/tls/tls.crt
            - name: WARM_TLS_KEY
              value: /etc/warm/tls/tls.key
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: {{ $scheme }}}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.auth.keysFile }}
            - name: keys
              mountPath: /etc/warm/keys
              readOnly: true
            {{- end }}
            {{- if .Values.tls.existingSecret }}
            - name: tls
              mountPath: /etc/warm/tls
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.auth.keysFile }}
        - name: keys
          secret:
            secretName: {{ include "warm-server.authSecret" . }}
            items:
              - key: keys.json
                path: keys.json
        {{- end }}
        {{- if .Values.tls.existingSecret }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.persistence.emptyDirSizeLimit }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "warm-server.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
