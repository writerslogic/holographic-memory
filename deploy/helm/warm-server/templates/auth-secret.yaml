{{- if and (not .Values.auth.existingSecret) .Values.auth.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "warm-server.authSecret" . }}
  labels:
    {{- include "warm-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  WARM_API_KEY: {{ .Values.auth.apiKey | quote }}
{{- end }}
