{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hms-server.fullname" . }}
  labels:
    {{- include "hms-server.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "hms-server.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      {{- if .Values.tls.existingSecret }}
      scheme: https
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      {{- with .Values.metrics.serviceMonitor.tokenSecret.name }}
      authorization:
        type: Bearer
        credentials:
          name: {{ . }}
          key: {{ $.Values.metrics.serviceMonitor.tokenSecret.key }}
      {{- end }}
{{- end }}
