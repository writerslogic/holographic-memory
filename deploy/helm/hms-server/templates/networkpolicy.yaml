{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hms-server.fullname" . }}
  labels:
    {{- include "hms-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hms-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- if .Values.networkPolicy.allowFrom }}
      from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      {{- else }}
      from:
        - podSelector: {}
      {{- end }}
{{- end }}
