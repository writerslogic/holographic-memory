#
# docker compose -f deploy/compose/compose.yaml up --build
#
# Set the key before starting (the server refuses to start without credentials):
#   export WARM_API_KEY="$(openssl rand -hex 32)"
# Per-tenant keys instead: mount a key file and set WARM_KEYS_FILE (see docs/server/auth.md).

name: warm

services:
  warm-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: warm-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WARM_API_KEY: ${WARM_API_KEY:?set WARM_API_KEY (openssl rand -hex 32)}
      WARM_INPUT_DIM: ${WARM_INPUT_DIM:-384}
      WARM_DIM: ${WARM_DIM:-4096}
      WARM_MAX_CONCURRENT_WORK: ${WARM_MAX_CONCURRENT_WORK:-4}
      WARM_SHUTDOWN_DELAY_SECONDS: "0"
    volumes:
      - warm-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/warm-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  warm-data:
