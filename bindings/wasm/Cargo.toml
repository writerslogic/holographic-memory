[package]
name = "hms-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
rand = { version = "0.10", default-features = false }
rand_chacha = { version = "0.10", default-features = false }
fxhash = "0.2.1"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
sha2 = "0.11"
