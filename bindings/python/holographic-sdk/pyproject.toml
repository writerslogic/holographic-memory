[project]
name = "holographic-sdk"
version = "0.1.1"
description = "Zero-Trust FHE-Lite SDK for Holographic Memory System"
authors = [
    {name = "WritersLogic", email = "david@writerslogic.com"},
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0"
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
haystack = ["haystack-ai>=2.0.0"]
semantic-kernel = ["semantic-kernel>=1.0.0"]
dspy = ["dspy-ai>=2.4.0"]
crewai = ["crewai>=0.28.0"]
embedchain = ["embedchain>=0.1.114",
    "phidata>=2.4.0"]
phidata = ["phidata>=2.4.0"]

all = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "haystack-ai>=2.0.0",
    "semantic-kernel>=1.0.0",
    "dspy-ai>=2.4.0",
    "crewai>=0.28.0",
    "embedchain>=0.1.114",
    "phidata>=2.4.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
