[project]
name = "holographic-sdk"
version = "0.1.0"
description = "Zero-Trust FHE-Lite SDK for Holographic Memory System"
authors = [
    {name = "WritersLogic", email = "david@writerslogic.com"},
]
dependencies = [
    "numpy>=1.24.0",
    "requests>=2.31.0"
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0-or-later"}

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
haystack = ["haystack-ai>=2.0.0"]
all = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "haystack-ai>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
