[project]
name = "holographic-sdk"
version = "0.1.2"
description = "HTTP client and agent-framework adapters for a Holographic Memory System service"
authors = [
    {name = "WritersLogic", email = "david@writerslogic.com"},
]
dependencies = [
    "httpx>=0.27.0",
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}

[project.optional-dependencies]
langchain = ["langchain-core>=0.1.0"]
llamaindex = ["llama-index-core>=0.10.0"]
haystack = ["haystack-ai>=2.0.0"]
semantic-kernel = ["semantic-kernel>=1.0.0"]
dspy = ["dspy-ai>=2.4.0"]
crewai = ["crewai>=0.28.0"]
embedchain = ["embedchain>=0.1.114"]
phidata = ["phidata>=2.4.0"]
pydantic-ai = ["pydantic-ai>=0.0.14"]
smolagents = ["smolagents>=1.0.0"]
all = [
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "haystack-ai>=2.0.0",
    "semantic-kernel>=1.0.0",
    "dspy-ai>=2.4.0",
    "crewai>=0.28.0",
    "embedchain>=0.1.114",
    "phidata>=2.4.0",
    "pydantic-ai>=0.0.14",
    "smolagents>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
