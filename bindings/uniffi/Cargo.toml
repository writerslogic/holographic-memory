[package]
name = "warm-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "UniFFI bindings (Swift, Kotlin) for the WritersLogic Adaptive Retention & Memory document store."
publish = false

# Standalone workspace root: the mobile toolchains build this crate on its own.
[workspace]

[lib]
name = "warm_mobile"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
writerslogic-warm = { path = "../..", features = ["security"] }
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
libc = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
