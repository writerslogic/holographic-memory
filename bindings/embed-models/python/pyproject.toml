[project]
name = "holographic-memory-models"
version = "0.1.0"
description = "Pinned offline embedding model pack for Holographic Memory Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "WritersLogic, Inc.", email = "david@writerslogic.com" }]

[project.urls]
Homepage = "https://holographic-memory.com/"
Repository = "https://github.com/writerslogic/holographic-memory"
Documentation = "https://docs.holographic-memory.com/latest/embeddings/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["holographic_memory_models"]
# The packs are build products (tens of MB, git-ignored): `build_packs.sh` creates them before the wheel is built.
artifacts = ["holographic_memory_models/packs/*.hmsemb"]
