[project]
name = "writerslogic-warm-models"
version = "0.1.0"
description = "Pinned offline embedding model pack for WARM Python bindings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "WritersLogic, Inc.", email = "david@writerslogic.com" }]

[project.urls]
Homepage = "https://writerslogic.com/warm/"
Repository = "https://github.com/writerslogic/warm"
Documentation = "https://writerslogic.com/warm/docs/latest/embeddings/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["writerslogic_warm_models"]
# The packs are build products (tens of MB, git-ignored): `build_packs.sh` creates them before the wheel is built.
artifacts = ["writerslogic_warm_models/packs/*.hmsemb"]
