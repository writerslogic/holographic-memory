[package]
name = "writerslogic-warm-c"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["WritersLogic, Inc. <david@writerslogic.com>"]
description = "Stable C ABI for the WritersLogic Adaptive Retention & Memory document store (C, Go, Java and .NET bindings)."
repository = "https://github.com/writerslogic/warm"
publish = false

[lib]
name = "writerslogic_warm_c"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
writerslogic-warm = { package = "warm-rust", path = "../..", features = ["security"] }
parking_lot = "0.12"
serde_json = "1"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
rayon = "1.8"
tempfile = "3"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
