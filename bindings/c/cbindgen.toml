language = "C"
include_guard = "HMS_H"
pragma_once = true
sys_includes = ["stddef.h", "stdint.h"]
cpp_compat = true
style = "type"
documentation = true
documentation_style = "c99"
usize_is_size_t = true
header = """/* Copyright 2024-2026 WritersLogic Contributors */
/* SPDX-License-Identifier: Apache-2.0 */
/* Generated by cbindgen from bindings/c/src; do not edit. Regenerate with bindings/c/scripts/gen-header.sh. */"""
trailer = """
/* Unversioned aliases. Define HMS_NO_ALIASES to use only the hms1_ symbols, for
   example when linking two major ABI versions into one process. */
#ifndef HMS_NO_ALIASES
#define hms_abi_version hms1_abi_version
#define hms_version hms1_version
#define hms_last_error_code hms1_last_error_code
#define hms_last_error_message hms1_last_error_message
#define hms_open_options_init hms1_open_options_init
#define hms_search_options_init hms1_search_options_init
#define hms_store_open hms1_store_open
#define hms_store_close hms1_store_close
#define hms_store_ingest hms1_store_ingest
#define hms_store_search hms1_store_search
#define hms_store_delete hms1_store_delete
#define hms_store_stats hms1_store_stats
#define hms_store_security_status hms1_store_security_status
#define hms_store_flush hms1_store_flush
#define hms_store_compact hms1_store_compact
#define hms_store_maintain hms1_store_maintain
#define hms_store_snapshot hms1_store_snapshot
#define hms_chunk_document hms1_chunk_document
#define hms_results_count hms1_results_count
#define hms_results_get hms1_results_get
#define hms_results_free hms1_results_free
#define hms_chunks_count hms1_chunks_count
