   example when linking two major ABI versions into one process. */
#ifndef WARM_NO_ALIASES
#define warm_abi_version hms1_abi_version
#define warm_version hms1_version
#define warm_last_error_code hms1_last_error_code
#define warm_last_error_message hms1_last_error_message
#define warm_open_options_init hms1_open_options_init
#define warm_search_options_init hms1_search_options_init
#define warm_store_open hms1_store_open
#define warm_store_close hms1_store_close
#define warm_store_ingest hms1_store_ingest
#define warm_store_search hms1_store_search
#define warm_store_delete hms1_store_delete
#define warm_store_stats hms1_store_stats
#define warm_store_security_status hms1_store_security_status
#define warm_store_flush hms1_store_flush
#define warm_store_compact hms1_store_compact
#define warm_store_maintain hms1_store_maintain
#define warm_store_snapshot hms1_store_snapshot
#define warm_chunk_document hms1_chunk_document
#define warm_results_count hms1_results_count
