#
# One pipeline per `v*` tag: build and smoke-test every artefact (Python wheels and sdist,
# eight npm native packages with the root package, the crate), write a CycloneDX SBOM per
# artefact, attest SLSA build provenance and the SBOMs, then publish.
#
# Everything up to and including the attestations also runs on workflow_dispatch and on pull
# requests that touch the release machinery. A protected manual crate-only recovery can publish
# after a tag's crate upload fails; the normal publish jobs and GitHub release run only on `v*` tags.
# The publish jobs sit behind their own environments
# (`crates-io`, `npm`, `release`; give them required reviewers). PyPI publishing stays in
# warm-py-release.yml, whose trusted publisher is bound to that file name. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_crate_only:
        description: Publish the current version's crate only after a failed tag upload
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - scripts/ci/pair-sboms.py
      - scripts/ci/check-versions.py

permissions:
  contents: read

jobs:
  python:
    if: ${{ !inputs.publish_crate_only }}
    uses: ./.github/workflows/python-wheels.yml
    permissions:
      contents: read

  npm:
    if: ${{ !inputs.publish_crate_only }}
    uses: ./.github/workflows/npm-packages.yml
    permissions:
      contents: read

  fuzz:
    if: ${{ !inputs.publish_crate_only }}
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: "120"
    permissions:
      contents: read

  crate:
    if: ${{ !inputs.publish_crate_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Crate, npm and tag versions agree
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/ci/check-versions.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/ci/check-versions.py
          fi
      - name: Package and verify the crate builds from its own tarball
        run: |
          cargo package --locked --no-default-features
          bytes=$(stat -c%s target/package/warm-rust-*.crate)
          if (( bytes >= 9500000 )); then
            echo "::error::Crate archive is ${bytes} bytes; crates.io uploads are limited to 10 MiB"
            exit 1
          fi
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --no-default-features --override-filename warm-rust-crate.cdx
          mkdir -p dist
          cp target/package/*.crate dist/
          mv warm-rust-crate.cdx.json dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: dist
          if-no-files-found: error

  collect:
    name: collect artefacts and SBOMs
    needs: [python, npm, crate, fuzz]
    runs-on: ubuntu-latest
    outputs:
      artefacts: ${{ steps.pair.outputs.artefacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: downloaded
          pattern: "{wheels-*,npm-tarballs,crate}"
      - name: Pair every artefact with its SBOM
        id: pair
        run: |
          set -euo pipefail
          names=$(python3 scripts/ci/pair-sboms.py downloaded release)
          echo "artefacts=$names" >> "$GITHUB_OUTPUT"
          (cd release && sha256sum -- * > SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error

  attest:
    name: attest provenance
    if: github.event_name != 'pull_request'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - name: SLSA build provenance for every artefact and SBOM
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tar.gz
            release/*.tgz
            release/*.crate
            release/*.cdx.json
      - name: Keep the provenance bundle for the release (Scorecard Signed-Releases)
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" release/provenance.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: release/provenance.intoto.jsonl
          if-no-files-found: error

  attest-sbom:
    name: attest SBOM (${{ matrix.artefact }})
    if: github.event_name != 'pull_request'
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        artefact: ${{ fromJSON(needs.collect.outputs.artefacts) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/${{ matrix.artefact }}
          sbom-path: release/${{ matrix.artefact }}.cdx.json

  github-release:
    name: draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, attest-sbom]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{release-assets,provenance}"
          path: release
          merge-multiple: true
      - name: Create the draft release with every artefact, SBOM, checksum and provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drafted so the notes are written and the release is published by a person.
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes release/*

  publish-crate:
    name: publish to crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, attest-sbom]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Exchange the OIDC token for a short-lived crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-default-features

  publish-crate-recovery:
    name: publish crate only to crates.io
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crate_only
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Crate and npm versions agree
        run: python3 scripts/ci/check-versions.py
      - name: Package, verify and check upload size
        id: package
        run: |
          set -euo pipefail
          cargo package --locked --no-default-features
          bytes=$(stat -c%s target/package/warm-rust-*.crate)
          if (( bytes >= 9500000 )); then
            echo "::error::Crate archive is ${bytes} bytes; crates.io uploads are limited to 10 MiB"
            exit 1
          fi
          echo "crate_name=$(basename target/package/warm-rust-*.crate)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --no-default-features --override-filename warm-rust-crate.cdx
          mkdir -p dist
          cp target/package/*.crate dist/
          mv warm-rust-crate.cdx.json "dist/${{ steps.package.outputs.crate_name }}.cdx.json"
      - name: Attest crate and SBOM provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.crate
            dist/*.cdx.json
      - name: Attest crate SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ steps.package.outputs.crate_name }}
          sbom-path: dist/${{ steps.package.outputs.crate_name }}.cdx.json
      - name: Keep crate provenance bundle
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/crate-recovery-provenance.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-recovery
          path: dist
          if-no-files-found: error
      - name: Exchange the OIDC token for a short-lived crates.io token (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-default-features

  publish-npm:
    name: publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [attest, attest-sbom]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs
      - name: Publish the platform packages first, then the root package that depends on them
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd tarballs
          for tarball in writerslogic-warm-*-*.tgz; do
            npm publish "$tarball" --provenance --access public
          done
          root=$(ls writerslogic-warm-[0-9]*.tgz)
          npm publish "$root" --provenance --access public

  correct-npm-deprecation:
    name: correct the 0.3.0 npm deprecation
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Keep 0.3.0 deprecated with an accurate upgrade message
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm deprecate 'holographic-memory@0.3.0' "0.3.0 is unmaintained; upgrade to ${VERSION#v}."

  verify-published:
    name: install the published packages and search
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-npm, correct-npm-deprecation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install from the registry (bounded wait for propagation) and run a search
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          platform_packages=()
          while IFS= read -r package; do platform_packages+=("$package"); done < <(node -e "console.log(Object.keys(require('./package.json').optionalDependencies).join('\n'))")
          [ "${#platform_packages[@]}" -gt 0 ]
          [ -n "${platform_packages[0]}" ]
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          for attempt in {1..20}; do
            ready=1
            for package in writerslogic-warm "${platform_packages[@]}"; do
              if ! npm_config_cache="$RUNNER_TEMP/npm-release-$attempt" npm view "${package}@${version}" version > /dev/null 2>&1; then
                echo "${package}@${version} is not available yet (attempt $attempt/20)"
                ready=0
              fi
            done
            [ "$ready" = 1 ] && break
            [ "$attempt" = 20 ] && { echo "Published npm packages did not all become available" >&2; exit 1; }
            sleep 30
          done
          npm_config_cache="$RUNNER_TEMP/npm-release-install" npm install --ignore-scripts --save-exact --no-audit --no-fund "writerslogic-warm@${version}"
          npm audit signatures
          node -e "
            const assert = require('node:assert/strict');
            (async () => {
              const { WarmMemorySystem } = require('writerslogic-warm');
              const { DocumentMemory } = await import('writerslogic-warm/semantic');
              const memory = new DocumentMemory(new WarmMemorySystem(4096, './store'));
              await memory.memorize({ id: 'a', text: 'Backups protect stored documents.', sourceUri: 'a.md' });
              assert.equal((await memory.search('backups'))[0].sourceUri, 'a.md');
              await memory.flush();
            })().catch(e => { console.error(e); process.exit(1); });"
