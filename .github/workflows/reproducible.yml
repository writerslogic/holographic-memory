#
# Reproducible-build check: two independent runners build the same commit from different
# checkout paths with the same pinned inputs (Cargo.lock, rustc, maturin, SOURCE_DATE_EPOCH)
# and the artefact hashes must be identical. Exceptions and their reasons are listed in
# docs/RELEASING.md ("Reproducible builds"); this job fails on any difference outside them.
# Release builds elsewhere use no build cache, so what is compared is what is shipped.
name: Reproducible build

on:
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/reproducible.yml
      - scripts/ci/repro-build.sh
      - scripts/ci/compare-hashes.py
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - pyproject.toml

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.builder }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        builder: [first, second]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkout-${{ matrix.builder }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build and hash
        working-directory: checkout-${{ matrix.builder }}
        env:
          OUT: ${{ github.workspace }}/out-${{ matrix.builder }}
        run: scripts/ci/repro-build.sh "$OUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-${{ matrix.builder }}
          path: |
            out-${{ matrix.builder }}/SHA256SUMS
            out-${{ matrix.builder }}/*.whl
          if-no-files-found: error

  compare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repro-*
          path: hashes
      - name: Hashes must match (the wheel is checked member by member below)
        run: |
          first=$(find hashes/repro-first -name SHA256SUMS)
          second=$(find hashes/repro-second -name SHA256SUMS)
          python3 scripts/ci/compare-hashes.py "$first" "$second" --allow '*.whl'
      - name: The wheels may differ only in the SBOM maturin embeds
        run: |
          set -euo pipefail
          for side in first second; do
            mkdir -p "/tmp/$side"
            unzip -q -o "$(find "hashes/repro-$side" -name '*.whl')" -d "/tmp/$side"
          done
          # The embedded SBOM names the absolute checkout directory in its bom-refs, and the
          # two legs deliberately build from different directories.
          others=$(diff -rq /tmp/first /tmp/second | grep -vE '\.dist-info/(sboms/|RECORD)' || true)
          if [ -n "$others" ]; then echo "$others"; exit 1; fi
          echo "wheel members identical except dist-info/sboms and RECORD (which lists the SBOM hash)"
