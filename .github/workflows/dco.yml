#
# Developer Certificate of Origin: every commit of a pull request is signed off
# (`git commit -s`). The project is Apache-2.0 and takes contributions under the DCO; there
# is no CLA. scripts/ci/check-dco.py has the rules (bots and merge commits are exempt;
# maintainers only get a warning).
name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every commit is signed off
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: python3 scripts/ci/check-dco.py
