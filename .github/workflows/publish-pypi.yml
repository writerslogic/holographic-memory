#
# Dormant until a `py-v*` tag is pushed. The wheels, the sdist and the SDK are built and
# smoke-tested by every other trigger (workflow_dispatch, a pull request touching this file)
# WITHOUT publishing: the publish jobs run only on a `py-v*` tag, inside the `pypi`
# environment (add required reviewers there), through PyPI Trusted Publishing (OIDC, no
# token). The trusted publisher on PyPI is bound to this file name and the `pypi` environment,
# so keep both. PyPI attestations (PEP 740) are produced by the publish action.
name: publish-pypi

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/publish-pypi.yml
      - bindings/python/holographic-sdk/**

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/python-wheels.yml
    permissions:
      contents: read

  holographic-sdk-build:
    name: Build and test Holographic SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Build SDK
        working-directory: bindings/python/holographic-sdk
        run: uv build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build hms-server for the live tests
        run: cargo build --locked --features server --bin hms-server
      - name: Test SDK against the real server
        working-directory: bindings/python/holographic-sdk
        env:
          HMS_SERVER_BIN: ${{ github.workspace }}/target/debug/hms-server
          PYTHONPATH: .
        run: uv run --no-project --with 'httpx>=0.27' --with pytest pytest -q -rs tests
      - name: Install the built wheel in a clean environment
        working-directory: bindings/python/holographic-sdk
        run: |
          set -euo pipefail
          uv venv /tmp/sdk-venv
          uv pip install --python /tmp/sdk-venv/bin/python dist/*.whl
          /tmp/sdk-venv/bin/python -I -c "import holographic_sdk; print(holographic_sdk.__name__, 'imports')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-dist
          path: bindings/python/holographic-sdk/dist
          if-no-files-found: error

  publish:
    name: Publish holographic-vsa to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, holographic-sdk-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Keep only distributions (SBOMs are attached to the GitHub release)
        run: |
          set -euo pipefail
          find dist -name '*.cdx.json' -delete
          ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true

  holographic-sdk-publish:
    name: Publish holographic-sdk to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [holographic-sdk-build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: sdk-dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
