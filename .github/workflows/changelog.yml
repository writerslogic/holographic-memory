name: Changelog

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Verify changelog is up to date
        # CHANGELOG.md is regenerated when a release is prepared, so every squash-merge to main
        # makes it stale by one commit. main only warns; a release tag must have it current.
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if git diff --exit-code -- CHANGELOG.md; then exit 0; fi
          echo "::warning::CHANGELOG.md is stale; run git cliff -c cliff.toml -o CHANGELOG.md and commit it as chore: update changelog"
          [ "$REF_TYPE" != "tag" ]
