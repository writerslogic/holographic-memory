#
# Every check runs as its own job so they execute in parallel; the `check` job at the
# end is the single aggregate (required-status-check target) and fails if any of them
# did not succeed. Rust build caches (Swatinem/rust-cache) are written only from main;
# pull requests restore them. Tests build with opt-level 1 and no debuginfo: measured on
# these runners, the all-features suite takes 22 s to run at opt-level 2, ~170 s at opt-level 0,
# and opt-level 1 compiles ~25% faster than 2 (2 min warm in total instead of 5).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_spill_stress:
        description: Run five minutes of Windows spill stress tests before the full suite
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Release version metadata
        run: |
          uv run --no-project --python 3.12 python scripts/ci/check-versions.py
          uv run --no-project --python 3.12 python -m unittest scripts/ci/test_versions.py
      - run: cargo fmt -- --check
      - name: Clippy, all features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy, default features
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Generated TypeScript and JSON schemas
        run: bash scripts/check-generated.sh

  features:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [node-api, python, security, provenance, provenance-scitt, experimental, private-search, server, local-models, conversation-memory]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy with only this feature
        run: cargo clippy --locked --all-targets --features ${{ matrix.features }} -- -D warnings

  docs-rs:
    name: docs (rustdoc, warnings denied)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Rustdoc, all features
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.set }})
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: default features
            flags: ""
          - set: all features
            flags: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.set }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Unit and integration tests
        run: cargo nextest run --locked --no-fail-fast ${{ matrix.flags }}
      - name: Doc tests
        run: cargo test --locked --doc ${{ matrix.flags }}

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CARGO_PROFILE_TEST_OPT_LEVEL: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-windows
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest
      - name: Diagnose Windows spill lifetimes
        if: inputs.windows_spill_stress
        run: cargo nextest run --locked --lib --stress-duration 5m --retries 0 --fail-fast -E 'test(delta_rows::tests)'
      - name: Unit and integration tests
        run: cargo nextest run --locked --no-fail-fast
      - name: HTTP and MCP runtime contracts
        run: >-
          cargo nextest run --locked --features server,mcp --no-fail-fast --test-threads 1
          --bin warm-server --bin warm-mcp
          --test server --test server_api --test server_ops --test server_abuse --test server_ann

  bench-build:
    name: benchmarks compile
    runs-on: ubuntu-latest
    env:
      # Link-time optimisation adds minutes and proves nothing for a compile-only check.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo bench --locked --no-run --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --no-default-features

  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: recall
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enforce deterministic recall floor
        run: cargo run --locked --release --bin warm-eval -- --vectors 1200 --queries 50 --dimensions 4096 --assert-min-recall 0.90
      - name: Enforce document relevance floor
        run: cargo run --locked --release --bin warm-eval -- --dataset tests/fixtures/relevance.json --dimensions 4096 --k 3 --assert-min-recall 0.90

  python-sdk:
    name: python sdk (live server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build warm-server
        run: cargo build --locked --features server --bin warm-server
      - name: SDK tests against the real server
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
        run: |
          uv run --no-project --python 3.11 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest pytest -q -rs tests
          uv run --no-project --with 'httpx>=0.27' --with 'sniffio>=1.3' --with orjson --with pytest pytest -q -rs tests/test_client.py tests/test_transport.py tests/test_live_server.py
      - name: LangChain contracts against the real server
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: |
          uv run --no-project --python 3.11 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'langchain-core==0.3.86' pytest -q -rs tests/test_langchain_live.py
          uv run --no-project --python 3.14 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'langchain-core==1.7.3' pytest -q -rs tests/test_langchain_live.py


      - name: LlamaIndex contracts against the real server
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
        run: |
          uv run --no-project --python 3.11 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'llama-index-core==0.10.0' pytest -q -rs tests/test_llamaindex_live.py
          uv run --no-project --python 3.14 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'llama-index-core==0.14.25' pytest -q -rs tests/test_llamaindex_live.py

      - name: Haystack contracts against the real server
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
          HAYSTACK_TELEMETRY_ENABLED: 'false'
        run: |
          uv run --no-project --python 3.11 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'haystack-ai==2.0.0' pytest -q -rs tests/test_haystack_live.py
          uv run --no-project --python 3.14 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'haystack-ai==3.4.1' pytest -q -rs tests/test_haystack_live.py

      - name: Pydantic AI contracts without paid providers
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
        run: |
          uv run --no-project --python 3.11 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'pydantic-ai-slim==2.64.0' pytest -q -rs tests/test_pydantic_ai_live.py
          uv run --no-project --python 3.14 --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest --with 'pydantic-ai-slim==2.64.0' pytest -q -rs tests/test_pydantic_ai_live.py

      - name: DSPy contracts with memory-only cache profile
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          uv run --no-project --python 3.12 --with './bindings/python/warm-sdk' --with './integrations/python[dspy]' --with 'dspy==3.4.1' --with 'litellm==1.103.10' --with 'filelock==4.2.6' --with pytest --with pytest-asyncio pytest -q -rs integrations/python/tests/dspy

      - name: Maintained Semantic Kernel contracts against the real server
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          OTEL_SDK_DISABLED: 'true'
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: |
          uv run --no-project --python 3.11 --with './bindings/python/warm-sdk' --with './integrations/python[semantic-kernel]' --with 'semantic-kernel==1.45.0' --with pytest --with pytest-asyncio pytest -q -rs integrations/python/tests/semantic_kernel
          uv run --no-project --python 3.14 --with './bindings/python/warm-sdk' --with './integrations/python[semantic-kernel]' --with 'semantic-kernel==1.46.0' --with pytest --with pytest-asyncio pytest -q -rs integrations/python/tests/semantic_kernel

      - name: CrewAI and SmolAgents native tool contracts
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/debug/warm-server
          PYTHONPATH: .
          CREWAI_TELEMETRY_ENABLED: 'false'
          OTEL_SDK_DISABLED: 'true'
          LITELLM_LOCAL_MODEL_COST_MAP: 'True'
        run: |
          uv run --no-project --python 3.12 --with 'crewai==1.15.33' --with 'filelock==4.2.6' --with 'litellm==1.103.10' --with 'smolagents==1.26.0' --with 'httpx>=0.27' --with 'sniffio>=1.3' --with pytest pytest -q -rs tests/test_framework_tools_live.py

  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The release workflows build with link-time optimisation; the API tests do not need it.
      CARGO_PROFILE_RELEASE_LTO: "false"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: node-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check generated TypeScript declarations
        run: git diff --exit-code -- index.d.ts
      - name: Test public APIs
        run: npm test
      - name: Test TypeScript declarations
        run: npm run test:types
      - name: Test packed distribution
        run: npm run test:package
      - name: Test framework adapters against the native binding
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --ignore-scripts --prefix integrations/js
          npm run build --prefix integrations/js
          npm test --prefix integrations/js
      - name: Test optional local embedding addon with synthetic offline weights
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          node scripts/build-node.cjs --release --features node-api,security,local-embed --no-js --output-dir target/node-embed
          WARM_EMBED_ADDON="$PWD/target/node-embed/writerslogic-warm.node" node --test tests/node/embedding-limits.test.cjs

  workflows:
    name: workflow lint and pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Every action is pinned to a SHA with a version comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/ci/verify-action-pins.py
      - name: actionlint
        run: uvx --from 'actionlint-py==1.7.12.25' actionlint -color
      - name: zizmor
        run: uvx 'zizmor==1.31.1' --min-severity medium --format plain .github/workflows

  check:
    name: check
    if: always()
    needs: [lint, features, docs-rs, test, test-windows, bench-build, deny, msrv, retrieval-quality, python-sdk, node, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
