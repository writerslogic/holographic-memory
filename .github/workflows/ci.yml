#
# Every check runs as its own job so they execute in parallel; the `check` job at the
# end is the single aggregate (required-status-check target) and fails if any of them
# did not succeed. Rust build caches (Swatinem/rust-cache) are written only from main;
# pull requests restore them. Tests build with CARGO_PROFILE_*_OPT_LEVEL=2 because the
# numeric tests are 10x slower unoptimized than the compile time they save.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: "1"

permissions:
  contents: read

jobs:
  lint:
    name: lint (fmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - run: cargo fmt -- --check
      - name: Clippy, all features
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy, default features
        run: cargo clippy --all-targets -- -D warnings

  features:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [node-api, python, security, provenance, provenance-scitt, experimental, private-search, server, local-models]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: feature-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - name: Clippy with only this feature
        run: cargo clippy --all-targets --features ${{ matrix.features }} -- -D warnings

  test:
    name: test (${{ matrix.set }})
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
      CARGO_PROFILE_TEST_OPT_LEVEL: "2"
    strategy:
      fail-fast: false
      matrix:
        include:
          - set: default features
            flags: ""
          - set: all features
            flags: "--all-features"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-${{ matrix.set }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest
      - name: Unit and integration tests
        run: cargo nextest run --locked --no-fail-fast ${{ matrix.flags }}
      - name: Doc tests
        run: cargo test --locked --doc ${{ matrix.flags }}

  bench-build:
    name: benchmarks compile
    runs-on: ubuntu-latest
    env:
      # Link-time optimisation adds minutes and proves nothing for a compile-only check.
      CARGO_PROFILE_BENCH_LTO: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - run: cargo bench --no-run --no-default-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - run: cargo check --no-default-features

  retrieval-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: recall
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - name: Enforce deterministic recall floor
        run: cargo run --release --bin hms-eval -- --vectors 1200 --queries 50 --dimensions 4096 --assert-min-recall 0.90
      - name: Enforce document relevance floor
        run: cargo run --release --bin hms-eval -- --dataset tests/fixtures/relevance.json --dimensions 4096 --k 3 --assert-min-recall 0.90

  python-sdk:
    name: python sdk (live server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: server
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Build hms-server
        run: cargo build --features server --bin hms-server
      - name: SDK tests against the real server
        working-directory: bindings/python/holographic-sdk
        env:
          HMS_SERVER_BIN: ${{ github.workspace }}/target/debug/hms-server
          PYTHONPATH: .
        run: uv run --no-project --with 'httpx>=0.27' --with pytest pytest -q -rs tests

  node:
    name: node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: node-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.head_ref == 'feat/ci-release' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci --omit=optional
      - run: npm run build
      - name: Test public APIs
        run: npm test
      - name: Test TypeScript declarations
        run: npm run test:types
      - name: Test packed distribution
        run: npm run test:package

  workflows:
    name: workflow lint and pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Every action is pinned to a SHA with a version comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python scripts/ci/verify-action-pins.py
      - name: actionlint
        run: uvx --from 'actionlint-py==1.7.12' actionlint -color
      - name: zizmor
        run: uvx 'zizmor==1.31.1' --min-severity medium --format plain .github/workflows

  check:
    name: check
    if: always()
    needs: [lint, features, test, bench-build, deny, msrv, retrieval-quality, python-sdk, node, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
