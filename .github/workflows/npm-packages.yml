#
# Builds the napi-rs native binding for eight targets (linux gnu and musl x64/arm64, darwin
# x64/arm64, win32 x64/arm64), lays each out as its own npm package, packs them with the
# JavaScript-only root package, then installs the tarballs into an empty project on a machine
# of every target (Alpine containers for musl, an old Debian for glibc) and runs a document
# search. Publishing requires an explicit protected dispatch; release.yml also reuses the build. No build
# cache is used (cache poisoning), so what is smoke-tested is what a clean build produces.
name: npm packages

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish verified WARM packages to npm after environment approval
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/npm-packages.yml
      - npm/README.md
      - scripts/ci/npm-platform-packages.cjs
      - scripts/ci/smoke-node.cjs
      - index.js
      - package.json
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Crate, npm and tag versions agree
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/ci/check-versions.py --tag "$GITHUB_REF_NAME"
          else
            python3 scripts/ci/check-versions.py
          fi

  build:
    name: build ${{ matrix.suffix }}
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin, flags: "" }
          - { suffix: darwin-x64, os: macos-latest, target: x86_64-apple-darwin, flags: "" }
          - { suffix: linux-x64-gnu, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: "--use-napi-cross", cross: "@napi-rs/cross-toolchain-x64-target-x86_64@1.0.3" }
          - { suffix: linux-arm64-gnu, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: "--use-napi-cross", cross: "@napi-rs/cross-toolchain-x64-target-aarch64@1.0.3" }
          - { suffix: linux-x64-musl, os: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: "-x", zig: true }
          - { suffix: linux-arm64-musl, os: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: "-x", zig: true }
          - { suffix: win32-x64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc, flags: "" }
          - { suffix: win32-arm64-msvc, os: windows-latest, target: aarch64-pc-windows-msvc, flags: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ matrix.zig }}
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: ${{ matrix.zig }}
        with:
          tool: cargo-zigbuild
      - run: npm ci --ignore-scripts
      - name: Install the glibc 2.17 cross toolchain (an optional peer of @napi-rs/cross-toolchain)
        if: ${{ matrix.cross }}
        env:
          CROSS: ${{ matrix.cross }}
        run: npm install --no-save --no-package-lock --ignore-scripts "$CROSS"
      - name: Build the binding
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          FLAGS: ${{ matrix.flags }}
        run: |
          # FLAGS is a trusted matrix constant; it must word-split into napi options.
          # shellcheck disable=SC2086
          npm run build:platform -- --target "$TARGET" $FLAGS
          ls -l ./*.node
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-cyclonedx
      - name: CycloneDX SBOM
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target "$TARGET" --features node-api,security \
            --override-filename "writerslogic-warm-${SUFFIX}.cdx"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binding-${{ matrix.suffix }}
          path: |
            writerslogic-warm.*.node
            writerslogic-warm-${{ matrix.suffix }}.cdx.json
          if-no-files-found: error

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binding-*
          path: bindings
          merge-multiple: true
      - name: Lay out and pack the packages
        run: |
          set -euo pipefail
          node scripts/ci/npm-platform-packages.cjs bindings staging
          mkdir -p tarballs
          for dir in staging/*/; do
            (cd "$dir" && npm pack --ignore-scripts --pack-destination ../../tarballs)
          done
          # The root package ships JavaScript only; the bindings come from the platform packages.
          cp npm/README.md README.md
          npm pack --ignore-scripts --pack-destination tarballs
          tar -xOf "tarballs/writerslogic-warm-$(node -p 'require("./package.json").version').tgz" package/README.md | cmp - npm/README.md
          cp bindings/*.cdx.json tarballs/
          npm sbom --sbom-format cyclonedx --package-lock-only --omit dev --omit optional --omit peer > "tarballs/writerslogic-warm-root-$(node -p 'require("./package.json").version').cdx.json"
          ls -l tarballs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: tarballs
          if-no-files-found: error

  smoke:
    name: install and search ${{ matrix.suffix }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { suffix: darwin-arm64, os: macos-latest }
          - { suffix: darwin-x64, os: macos-15-intel }
          - { suffix: linux-x64-gnu, os: ubuntu-latest }
          - { suffix: linux-x64-gnu, os: ubuntu-latest, image: "node:22-bullseye-slim@sha256:5736e7ef1f3f2109be7ef8aea0cbdf931804aee9a18c6760507b8ded078b25a9" }
          - { suffix: linux-arm64-gnu, os: ubuntu-24.04-arm }
          - { suffix: linux-arm64-gnu, os: ubuntu-24.04-arm, image: "node:22-bullseye-slim@sha256:5736e7ef1f3f2109be7ef8aea0cbdf931804aee9a18c6760507b8ded078b25a9" }
          - { suffix: linux-x64-musl, os: ubuntu-latest, image: "node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402" }
          - { suffix: linux-arm64-musl, os: ubuntu-24.04-arm, image: "node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402" }
          - { suffix: win32-x64-msvc, os: windows-latest }
          - { suffix: win32-arm64-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !matrix.image }}
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the tarballs and search
        if: ${{ !matrix.image }}
        shell: bash
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: node scripts/ci/smoke-node.cjs tarballs --expect "$SUFFIX"
      - name: Install the tarballs and search in ${{ matrix.image }}
        if: ${{ matrix.image }}
        env:
          SUFFIX: ${{ matrix.suffix }}
          IMAGE: ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/w" -w /w "$IMAGE" node scripts/ci/smoke-node.cjs tarballs --expect "$SUFFIX"

  publish-access:
    name: verify npm publishing credentials
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Authenticate without printing the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

  release-artifacts:
    name: attest verified npm artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.publish_npm && github.ref == 'refs/heads/main'
    needs: [smoke, publish-access]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifacts: ${{ steps.pair.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: downloaded/npm-tarballs
      - name: Pair each verified tarball with its SBOM
        id: pair
        run: |
          set -euo pipefail
          artifacts=$(python3 scripts/ci/pair-sboms.py downloaded release)
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"
          (cd release && sha256sum -- *.tgz *.cdx.json > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tgz
            release/*.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-assets
          path: release
          if-no-files-found: error

  release-sbom:
    name: attest npm SBOM (${{ matrix.artifact }})
    needs: release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.release-artifacts.outputs.artifacts) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-assets
          path: release
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/${{ matrix.artifact }}
          sbom-path: release/${{ matrix.artifact }}.cdx.json

  publish:
    name: publish verified WARM packages to npm
    needs: [release-artifacts, release-sbom]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-assets
          path: release
      - name: Publish platform packages before the root package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
          publish_tarball() {
            local tarball="$1" package version integrity existing
            package=$(tar -xOf "$tarball" package/package.json | jq -r .name)
            version=$(tar -xOf "$tarball" package/package.json | jq -r .version)
            integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            if existing=$(npm view "${package}@${version}" dist.integrity 2>/dev/null); then
              [ "$existing" = "$integrity" ] || { echo "::error::Published ${package}@${version} differs from verified artifact"; exit 1; }
              echo "Already published matching ${package}@${version}"
            else
              npm publish "$tarball" --provenance --access public
            fi
          }
          for tarball in writerslogic-warm-*-*.tgz; do
            publish_tarball "$tarball"
          done
          root=$(ls writerslogic-warm-[0-9]*.tgz)
          publish_tarball "$root"

  verify-published:
    name: install published WARM and search
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Verify registry availability, provenance and document search
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          mapfile -t packages < <(node -e "console.log(Object.keys(require('./package.json').optionalDependencies).join('\n'))")
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          for attempt in {1..20}; do
            ready=1
            for package in writerslogic-warm "${packages[@]}"; do
              if ! npm_config_cache="$RUNNER_TEMP/npm-release-$attempt" npm view "${package}@${version}" version > /dev/null 2>&1; then
                ready=0
              fi
            done
            [ "$ready" = 1 ] && break
            [ "$attempt" = 20 ] && { echo "Published packages did not all become available" >&2; exit 1; }
            sleep 30
          done
          npm install --ignore-scripts --save-exact --no-audit --no-fund "writerslogic-warm@${version}"
          npm audit signatures
          node -e "
            const assert = require('node:assert/strict');
            (async () => {
              const { WarmMemorySystem } = require('writerslogic-warm');
              const { DocumentMemory } = await import('writerslogic-warm/semantic');
              const memory = new DocumentMemory(new WarmMemorySystem(4096, './store'));
              await memory.memorize({ id: 'a', text: 'Backups protect stored documents.', sourceUri: 'a.md' });
              assert.equal((await memory.search('backups'))[0].sourceUri, 'a.md');
              await memory.flush();
            })().catch(e => { console.error(e); process.exit(1); });"
