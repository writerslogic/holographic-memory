name: MCP launcher release

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/warm-mcp-release.yml
      - integrations/mcp/**
      - scripts/ci/mcp-release.py

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check launcher versions and tag
        shell: bash
        run: |
          python3 -m unittest scripts/ci/test_mcp_release.py
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 scripts/ci/mcp-release.py "$GITHUB_REF_NAME"
          else
            version=$(node -p 'require("./integrations/mcp/npm/package.json").version')
            python3 scripts/ci/mcp-release.py "mcp-v$version"
          fi

  binary:
    name: binary ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, linux: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, linux: true }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        if: ${{ matrix.linux }}
        with:
          version: 0.14.1
          use-cache: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: ${{ matrix.linux }}
        with:
          tool: cargo-zigbuild
      - name: Build and smoke test MCP binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          test "$host" = "$TARGET"
          binary=target/release/warm-mcp
          if [[ "$TARGET" == *linux* ]]; then
            cargo zigbuild --release --locked --target "${TARGET}.2.17" --features mcp,security --bin warm-mcp
            binary="target/${TARGET}/release/warm-mcp"
            newer=$(readelf -W --version-info "$binary" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | cut -d_ -f2 | sort -Vu | awk -F. '$1 > 2 || ($1 == 2 && $2 > 17)' | head -1)
            test -z "$newer"
          else
            cargo build --release --locked --features mcp,security --bin warm-mcp
          fi
          extension=""
          if [[ "$TARGET" == *windows* ]]; then extension=".exe"; fi
          "${binary}${extension}" --version
          mkdir -p assets
          cp "${binary}${extension}" "assets/warm-mcp-${TARGET}${extension}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-binary-${{ matrix.target }}
          path: assets/warm-mcp-*
          if-no-files-found: error
          compression-level: 0

  package:
    needs: binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: mcp-release-assets
          pattern: mcp-binary-*
          merge-multiple: true
      - name: Write checksums and build launcher packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./integrations/mcp/npm/package.json").version')
          python3 scripts/ci/mcp-release.py "mcp-v$version" mcp-release-assets
          mkdir -p dist/npm dist/pypi
          npm pack integrations/mcp/npm --ignore-scripts --pack-destination dist/npm
          uv build integrations/mcp/pypi --out-dir dist/pypi
          test "$(find dist/npm -name '*.tgz' | wc -l | tr -d ' ')" = 1
          test "$(find dist/pypi -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find dist/pypi -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          tar -xOf dist/npm/*.tgz package/checksums.json | cmp - integrations/mcp/npm/checksums.json
          unzip -p dist/pypi/*.whl writerslogic_warm_mcp/checksums.json | cmp - integrations/mcp/npm/checksums.json
      - name: Test both launchers against a local release asset
        shell: bash
        run: |
          set -euo pipefail
          chmod +x mcp-release-assets/warm-mcp-x86_64-unknown-linux-gnu
          npm ci --prefix integrations/mcp/tests --ignore-scripts
          WARM_MCP_BIN="$PWD/mcp-release-assets/warm-mcp-x86_64-unknown-linux-gnu" node --test --test-concurrency=1 integrations/mcp/tests/launchers.test.mjs
          WARM_MCP_BIN="$PWD/mcp-release-assets/warm-mcp-x86_64-unknown-linux-gnu" WARM_MCP_SECURITY=1 npm test --prefix integrations/mcp/tests
      - name: Smoke test installed packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-npm"
          npm install --prefix "$RUNNER_TEMP/mcp-npm" --ignore-scripts --offline --no-audit --no-fund dist/npm/*.tgz
          WARM_MCP_BINARY="$PWD/mcp-release-assets/warm-mcp-x86_64-unknown-linux-gnu" node "$RUNNER_TEMP/mcp-npm/node_modules/writerslogic-warm-mcp/bin/cli.js" --version
          uv venv "$RUNNER_TEMP/mcp-venv"
          uv pip install --python "$RUNNER_TEMP/mcp-venv/bin/python" dist/pypi/*.whl
          WARM_MCP_BINARY="$PWD/mcp-release-assets/warm-mcp-x86_64-unknown-linux-gnu" "$RUNNER_TEMP/mcp-venv/bin/warm-mcp" --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-packages
          path: dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: mcp-release-assets
          pattern: mcp-binary-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-packages
          path: dist
      - name: Publish binary and package assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" mcp-release-assets/* dist/npm/* dist/pypi/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "WARM MCP $GITHUB_REF_NAME" \
            --notes "MCP binaries and checksum-verified npm and PyPI launchers."

  npm-publish:
    environment: npm
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-packages
          path: dist
      - name: Publish npm launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/npm/*.tgz --provenance --access public

  npm-verify:
    name: verify published MCP npm launcher
    needs: npm-publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the registry package and run its checksum-verified binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#mcp-v}"
          for attempt in {1..20}; do
            if npm_config_cache="$RUNNER_TEMP/mcp-registry-$attempt" npm view "writerslogic-warm-mcp@$version" version >/dev/null 2>&1; then
              break
            fi
            [ "$attempt" = 20 ] && { echo "MCP launcher did not appear in npm" >&2; exit 1; }
            sleep 30
          done
          mkdir consumer && cd consumer
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "writerslogic-warm-mcp@$version"
          npm audit signatures
          ./node_modules/.bin/writerslogic-warm-mcp --version

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-packages
          path: dist
      - name: Publish PyPI launcher
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi

  mcp-registry:
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [npm-publish, pypi-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify MCP Registry publisher
        shell: bash
        run: |
          set -euo pipefail
          archive=mcp-publisher_linux_amd64.tar.gz
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Wait for package indexes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#mcp-v}"
          for attempt in {1..30}; do
            if curl --fail --location --silent --show-error --max-time 15 \
              https://registry.npmjs.org/writerslogic-warm-mcp \
              | jq --exit-status --arg version "$version" '.versions[$version] != null' >/dev/null \
              && curl --fail --location --silent --show-error --max-time 15 \
                "https://pypi.org/pypi/warm-mcp/$version/json" \
                | jq --exit-status --arg version "$version" '.info.version == $version' >/dev/null; then
              exit 0
            fi
            if (( attempt < 30 )); then
              sleep 30
            fi
          done
          echo "::error::MCP launcher $version did not appear in npm and PyPI within 15 minutes"
          exit 1
      - name: Validate and publish MCP Registry entry
        run: |
          ./mcp-publisher validate integrations/mcp/server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish integrations/mcp/server.json
