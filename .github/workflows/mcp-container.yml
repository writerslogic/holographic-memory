name: MCP container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/mcp-container.yml
      - Cargo.toml
      - Cargo.lock
      - src/bin/warm-mcp.rs
      - src/bin/warm-mcp/**
      - scripts/ci/mcp_container_smoke.py
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/mcp-container.yml
      - Cargo.toml
      - Cargo.lock
      - src/bin/warm-mcp.rs
      - src/bin/warm-mcp/**
      - scripts/ci/mcp_container_smoke.py

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build MCP container
        run: docker build --progress=plain --tag warm-mcp:ci .
      - name: Inspect MCP tools over stdio
        run: python3 scripts/ci/mcp_container_smoke.py docker run --rm -i warm-mcp:ci
