name: Importers

on:
  push:
    branches: [ main ]
    paths:
      - 'bindings/python/warm-sdk/**'
      - 'src/bin/warm-server.rs'
      - '.github/workflows/importers.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bindings/python/warm-sdk/**'
      - 'src/bin/warm-server.rs'
      - '.github/workflows/importers.yml'

permissions:
  contents: read

jobs:
  importers:
    name: warm-import against a real warm-server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-importers-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build warm-server
        run: cargo build --release --locked --features server --bin warm-server

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Run importer tests
        working-directory: bindings/python/warm-sdk
        env:
          WARM_SERVER_BIN: ${{ github.workspace }}/target/release/warm-server
        run: |
          uv sync --locked --python 3.12 --group dev --group importers-test
          uv run --no-sync --python 3.12 pytest tests/importers -q -p no:cacheprovider
