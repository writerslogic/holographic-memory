name: Python native release

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/python-native-release.yml
      - .github/workflows/python-wheels.yml
      - pyproject.toml
      - bindings/python/README.md
      - scripts/ci/smoke-wheel.sh
      - scripts/ci/smoke_python.py
      - src/bindings/python/**
      - src/bindings/mod.rs
      - tests/python/**
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  wheels:
    uses: ./.github/workflows/python-wheels.yml
    permissions:
      contents: read

  publish:
    name: Publish writerslogic-warm-py to PyPI
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true
      - name: Keep only distributions
        run: |
          set -euo pipefail
          find dist -name '*.cdx.json' -delete
          ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          skip-existing: true
