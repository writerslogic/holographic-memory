#
# Line coverage of the library on every push to main. The result is a job summary and
# a downloadable artifact (lcov and a shields endpoint JSON); nothing is committed
# back, because main only accepts signed, reviewed pull requests.
name: Coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - name: Measure
        run: |
          set -euo pipefail
          mkdir -p coverage
          cargo llvm-cov --lib --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --json --output-path coverage/summary.json
          pct=$(jq -r '.data[0].totals.lines.percent' coverage/summary.json | xargs printf '%.1f')
          color=red
          if awk "BEGIN{exit !($pct >= 80)}"; then color=brightgreen; elif awk "BEGIN{exit !($pct >= 60)}"; then color=yellow; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage/badge.json
          echo "## Line coverage: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
