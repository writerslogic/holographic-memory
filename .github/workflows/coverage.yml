name: Coverage

on:
  push:
    branches: [ main ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@eba66cc6f87204a1e73f96e528e759b6c1fcf573 # cargo-llvm-cov

    - name: Cache cargo
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Generate coverage
      run: |
        cargo llvm-cov --lib --json --output-path coverage.json
        COVERAGE=$(cat coverage.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f\"{d['data'][0]['totals']['lines']['percent']:.1f}\")")
        echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
        echo "## Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

    - name: Generate badge
      run: |
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          COLOR="brightgreen"
        elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
          COLOR="yellow"
        else
          COLOR="red"
        fi
        mkdir -p .github/badges
        cat > .github/badges/coverage.json << EOF
        {
          "schemaVersion": 1,
          "label": "coverage",
          "message": "${COVERAGE}%",
          "color": "${COLOR}"
        }
        EOF

    - name: Commit badge
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .github/badges/coverage.json
        git diff --cached --quiet && exit 0
        git commit -m "ci: update coverage badge [skip ci]"
        for i in 1 2 3 4 5; do
          git push && break
          echo "push rejected, rebasing onto origin/main (attempt $i)"
          git pull --rebase --autostash origin main
        done
