[advisories]
version = 2
# "all" means check all crates (workspace + transitive) for unmaintained advisories.
unmaintained = "all"
yanked = "warn"

# Ignore advisories for unmaintained crates that have no safe upgrade path.
# bincode is unmaintained at every version (team ceased development); 2.x is the
# latest release and there is no maintained successor (RUSTSEC-2025-0141).
# TODO: paste comes from nalgebra/simba; upgrade path blocked on upstream (RUSTSEC-2024-0436)
# zip 8 is pulled only by candle-core 0.11 (its newest release pins zip ^8.6); the three
# advisories concern ZipArchive::extract (SUID bits, symlink targets, path traversal), which
# neither HMS nor candle calls: candle reads .pth archives by entry name. Drop these when
# candle moves to zip 9 (RUSTSEC-2026-0367, -0368, -0369).
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip extract SUID bits; extract is never called; blocked on candle-core > 0.11" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract symlink targets; extract is never called; blocked on candle-core > 0.11" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract path handling; extract is never called; blocked on candle-core > 0.11" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is unmaintained at all versions; on latest 2.x, no maintained successor" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a transitive dep via nalgebra/simba; no upstream fix available" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "Apache-2.0 WITH LLVM-exception",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
