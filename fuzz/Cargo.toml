bench = false

[[bin]]
name = "connection_graph_log"
path = "fuzz_targets/connection_graph_log.rs"
required-features = ["experimental"]
test = false
doc = false
bench = false

[[bin]]
name = "llm_output"
path = "fuzz_targets/llm_output.rs"
