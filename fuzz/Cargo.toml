[package]
name = "writerslogic-warm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
writerslogic-warm = { package = "warm-rust", path = ".." }
serde_json = "1.0"
tempfile = "3"
ed25519-dalek = { version = "3", optional = true }
# The warm-server sources are compiled into the server_requests target, so it needs the same
# dependencies the server does.
anyhow = { version = "1.0", optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"], optional = true }
bytes = { version = "1", optional = true }
clap = { version = "4.4", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"], optional = true }
libc = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
parking_lot = { version = "0.12", features = ["arc_lock"], optional = true }
crc32fast = { version = "1.3", optional = true }
rand = { version = "0.10", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
schemars = { version = "1.2", features = ["derive"], optional = true }
serde = { version = "1.0", features = ["derive", "rc"], optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2.6", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tower-service = { version = "0.3", optional = true }

[features]
provenance = ["writerslogic-warm/provenance", "dep:ed25519-dalek"]
private-search = ["writerslogic-warm/private-search"]
experimental = ["writerslogic-warm/experimental"]
local-models = ["writerslogic-warm/local-models"]
server = [
    "writerslogic-warm/server", "dep:anyhow", "dep:axum", "dep:bytes", "dep:clap", "dep:futures-util",
    "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:libc", "dep:parking_lot", "dep:rand",
    "dep:rustls", "dep:schemars", "dep:serde", "dep:sha2", "dep:subtle", "dep:tar", "dep:tokio",
    "dep:tokio-rustls", "dep:tower-service", "dep:memmap2", "dep:crc32fast",
]

[[bin]]
name = "wire_inputs"
path = "fuzz_targets/wire_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ivf_decode"
path = "fuzz_targets/ivf_decode.rs"
required-features = ["experimental"]
