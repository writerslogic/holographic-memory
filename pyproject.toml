[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "warm-python"
description = "Native Python bindings for WARM vector search and phase-vector algebra."
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "WritersLogic, Inc.", email = "david@writerslogic.com" }]
readme = "bindings/python/README.md"
keywords = ["vector-search", "nearest-neighbor", "ann", "embeddings", "vector-database", "vsa", "hyperdimensional", "writerslogic-warm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dynamic = ["version"]

[project.optional-dependencies]
embed = ["warm-models==0.1.0"]

[project.urls]
Homepage = "https://writerslogic.com/warm/"
Documentation = "https://writerslogic.com/warm/docs/"
Repository = "https://github.com/writerslogic/warm"

[tool.maturin]
# The import name is `writerslogic_warm` (matches the #[pymodule] in src/bindings/python/mod.rs);
# the PyPI distribution name is `warm-python` (the crate name is taken on PyPI).
module-name = "writerslogic_warm"
features = ["python", "local-embed-download"]
exclude = [
    { path = "benchmarks/results/**/*", format = "sdist" },
    { path = "assets/**/*", format = "sdist" },
]
# Version is read from Cargo.toml (dynamic).

[tool.uv.sources]
warm-models = { path = "bindings/embed-models/python" }
