float:
  any:
  - name: warm-qag-regression
    module: vibe.algorithms.qag_pair
    constructor: QAGPair
    singularity_image: warm
    disabled: false
    ood: false
    base_args: ['@metric']
    run_groups:
      frozen:
        args: [64, 500, 4]
        query_arg_groups:
        - [[0, 100, 100, 0], [1, 100, 100, 0],
           [0, 300, 400, 0], [1, 300, 400, 0],
           [0, 1000, 1000, 0], [1, 1000, 1000, 0],
           [1, 100, 100, 1], [0, 100, 100, 1],
           [1, 300, 400, 1], [0, 300, 400, 1],
           [1, 1000, 1000, 1], [0, 1000, 1000, 1],
           [0, 100, 100, 2], [1, 100, 100, 2],
           [0, 300, 400, 2], [1, 300, 400, 2],
           [0, 1000, 1000, 2], [1, 1000, 1000, 2]]
