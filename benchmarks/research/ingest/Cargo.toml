[package]
name = "warm-research-ingest"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Ingest timing of the eager, deferred and lexical encode modes with search parity checks"

# Standalone: the root crate is a dependency, not a workspace member.
[workspace]

[dependencies]
writerslogic-warm = { package = "warm-rust", path = "../../.." }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tempfile = "3"

[profile.release]
lto = true
opt-level = 3
