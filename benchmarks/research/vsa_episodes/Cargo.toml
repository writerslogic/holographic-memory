[package]
name = "hms-vsa-episodes-eval"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rust-stemmers = "1.2.0"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
