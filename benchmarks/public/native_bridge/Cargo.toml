[package]
name = "warm-native-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[lib]
name = "warm_native_bridge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.0", features = ["extension-module"] }
numpy = "=0.29.0"
self_cell = "=1.2.1"
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
bincode = { version = "=2.0.1", features = ["serde"] }
thiserror = "=2.0.18"

[build-dependencies]
pyo3-build-config = "=0.29.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
strip = false
