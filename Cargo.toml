[package]
name = "holographic-memory"
version = "0.6.3"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["WritersLogic, Inc. <david@writerslogic.com>"]
description = "Local-first search engine and agent memory: fast approximate nearest-neighbor and BM25 full-text search, encrypted stores, provable deletion, built on vector-symbolic architectures."
repository = "https://github.com/writerslogic/holographic-memory"
homepage = "https://holographic-memory.com"
documentation = "https://docs.rs/holographic-memory"
keywords = ["vector-database", "vector-search", "full-text-search", "agent-memory", "rag"]
categories = ["database-implementations", "text-processing", "algorithms", "data-structures", "science"]
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/build.rs",
    "/src/**",
    "/tests/**",
    "/examples/**",
    "/benches/**",
    "/docs/**",
    "/benchmarks/embedding/embed_store_bench.rs",
    "/benchmarks/public/vector_glove_development.rs",
    "/benchmarks/public/vector_glove_diagnosis.rs",
    "/benchmarks/research/phase_resonator/cases.rs",
    "/benchmarks/results/holography_resonator_v1/baseline.rs",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3.9", features = ["async", "serde-json"], optional = true }
napi-derive = { version = "3.5", optional = true }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"], optional = true }
numpy = { version = "0.30", optional = true }
tokio = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive", "rc"] }
ts-rs = { version = "12", features = ["serde-compat"], optional = true }
schemars = { version = "1.2", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_json_canonicalizer = { version = "0.4.1", optional = true }
flate2 = { version = "1.1", optional = true }
http = { version = "1", optional = true }
bincode = { version = "2.0", features = ["serde"] }
rand = "0.10"
crc32fast = "1.3"
lz4_flex = "0.14"
rayon = "1.8"
parking_lot = { version = "0.12", features = ["arc_lock"], optional = true }
memmap2 = "0.9"
bytemuck = "1"
mimalloc = { version = "0.1", default-features = false, optional = true }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
clap = { version = "4.4", features = ["derive", "env"], optional = true }
foldhash = "0.2"
nalgebra = { version = "0.35", features = ["serde-serialize"] }
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }
zeroize = { version = "1", features = ["derive"], optional = true }
aes-gcm = { version = "0.11", optional = true }
argon2 = { version = "0.6", optional = true }
sha2 = { version = "0.11", optional = true }
coset = { version = "0.4", optional = true }
ciborium = { version = "0.2", optional = true }
bs58 = { version = "0.5", optional = true }
ureq = { version = "3", optional = true }
multibase = { version = "0.9", optional = true }
base64 = { version = "0.23", optional = true }
tempfile = "3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"], optional = true }
subtle = { version = "2.6", optional = true }
# `server` feature: accept loop, TLS, snapshot archives, process metrics.
hyper = { version = "1", default-features = false, features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["server-auto", "server-graceful", "service", "tokio", "http1", "http2"], optional = true }
tower-service = { version = "0.3", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
tar = { version = "0.4", default-features = false, optional = true }
libc = { version = "0.2", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", default-features = false, optional = true }
# On-device model stages (`local-models`): CPU everywhere, Metal on macOS. Needs Rust >= 1.94:
# candle-core 0.11 uses `stdarch_neon_f16` on aarch64 (fails on 1.89; 1.90-1.93 untested).
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"], optional = true }
rust-stemmers = "1.2.0"
# MCP server (`hms-mcp`): the official Rust SDK; client + child-process transport serve the tests.
rmcp = { version = "3.6", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server"], optional = true }
tokio-util = { version = "0.7", optional = true }
libm = { version = "0.2", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"], optional = true }
candle-nn = { version = "0.11", features = ["metal"], optional = true }
candle-transformers = { version = "0.11", features = ["metal"], optional = true }

# CUDA for the Modal image only, enabled from outside the crate with RUSTFLAGS="--cfg hms_cuda",
# so `--all-features` never needs nvcc.
[target.'cfg(hms_cuda)'.dependencies]
candle-core = { version = "0.11", features = ["cuda"], optional = true }
candle-nn = { version = "0.11", features = ["cuda"], optional = true }
candle-transformers = { version = "0.11", features = ["cuda"], optional = true }

[build-dependencies]
napi-build = { version = "2.2", optional = true }

[dev-dependencies]
criterion = "0.8"
proptest = "1.0"
tempfile = "3"
# TLS tests mint a throwaway certificate; ring keeps it free of the C toolchain.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }

[[bench]]
name = "hms_benchmark"
harness = false

[[example]]
name = "verify_cogmem_sample"
required-features = ["provenance"]

[[example]]
name = "emit_w3c_credential"
required-features = ["provenance"]

[[example]]
name = "zero_trust_demo"
required-features = ["security"]

[[bin]]
name = "security-probe"
path = "src/bin/research/security-probe.rs"
required-features = ["security", "server"]

[features]
default = []
# Command-line parsing (clap) for the binaries and examples that take arguments.
cli = ["dep:clap"]
# Global allocator of the public-bench binary only; never linked into the library.
mimalloc = ["dep:mimalloc"]
conversation-memory = ["sha2"]
node-api = ["napi", "napi-derive", "tokio", "tokio/rt", "napi-build", "dep:ts-rs"]
# Python bindings (pyo3 + maturin). Exposes the quantized-phase substrate. Build
# wheels with `maturin build --features python`; publishing is wired in
# .github/workflows/publish-pypi.yml and dormant until a `py-v*` tag is pushed.
python = ["pyo3", "dep:numpy"]
security = ["ed25519-dalek", "zeroize", "aes-gcm", "aes-gcm/zeroize", "argon2", "sha2"]
provenance = ["security", "dep:parking_lot", "coset", "ciborium", "bs58", "multibase", "base64", "dep:serde_json_canonicalizer", "dep:flate2", "dep:http"]
provenance-scitt = ["provenance", "ureq"]
# Experimental VSA research modules (algebraic_codebook, block_codes, bloom_memory,
# bundle_subset, connection_graph, counting_bloom_memory, operand_retriever,
# phase_graph), the connection and phase graph hooks on HmsCore, the qgraph
# diagnostics, projection_diagnostic and quantized IVF modules, the capped-union
# text encoder and the experiment binaries that exercise them. Off by default so
# they are not part of the published public API.
experimental = []
experimental-batch-pool = ["experimental"]
experimental-neighbor-admission = ["experimental"]
experimental-query-x4 = ["experimental"]
experimental-build-search = ["experimental"]
# On-device embedding, re-ranking, fact extraction and query rewriting (candle, Qwen3).
# Weights load from local directories only; the library never downloads.
local-models = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
# Pure-Rust local text embeddings: int8/f16 BERT-family inference, tokenizer from the model
# pack, sha256-pinned packs. No network code; packs load from a path, an env var or the cache.
local-embed = ["dep:tokenizers", "sha2", "dep:libm"]
# First-use download of the pinned upstream model files into the cache (adds ureq).
local-embed-download = ["local-embed", "ureq"]
# Experimental query-private similarity scoring (LWE, SimplePIR-style). Hides
# the query from the server only; see docs/PRIVATE-SEARCH.md for the limits.
private-search = ["zeroize", "rand/chacha"]
# HTTP service for the holographic-memory-sdk Python client (`hms-server` binary).
server = ["dep:parking_lot", "tokio", "tokio/rt-multi-thread", "tokio/macros", "tokio/net", "tokio/time", "tokio/sync", "tokio/io-util", "tokio/fs", "tokio/signal", "cli", "dep:schemars", "axum", "subtle", "sha2", "dep:hyper", "dep:hyper-util", "dep:tower-service", "dep:rustls", "dep:tokio-rustls", "dep:tar", "dep:libc", "dep:http-body-util", "dep:bytes", "dep:futures-util"]
# MCP server over stdio and streamable HTTP (`hms-mcp` binary). Encryption at rest needs `security`;
# semantic recall needs `local-models`.
mcp = ["dep:parking_lot", "dep:rmcp", "dep:tokio-util", "tokio", "tokio/rt-multi-thread", "tokio/macros", "tokio/net", "tokio/time", "tokio/sync", "tokio/signal", "cli", "axum", "subtle"]

[[bin]]
name = "hms-embed"
path = "src/bin/hms-embed.rs"
required-features = ["local-embed", "cli"]

[[bin]]
name = "embed-store-bench"
path = "benchmarks/embedding/embed_store_bench.rs"
