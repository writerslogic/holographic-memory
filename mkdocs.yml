# The navigation is not listed here. docs/.nav.yml orders the top-level sections and each
# docs/<area>/ folder lists itself, so a PR that adds a page under its own area never edits this file.
# Landing-page copy and the capability list live in docs/_data/site.yml (scripts/docs_site.py).

site_name: WARM
site_description: Hybrid search, graph indexing, and vector-symbolic memory. Runs on your machine, no service calls.
site_url: !ENV [WARM_SITE_URL, "https://writerslogic.com/warm/docs/dev/"]
repo_url: https://github.com/writerslogic/warm
repo_name: writerslogic/warm
edit_uri: edit/main/docs/
copyright: Copyright 2024-2026 WritersLogic Contributors. Apache-2.0.

docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/crystal-detailed-static.svg
  favicon: assets/crystal-detailed-static.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

plugins:
  - gen-files:
      scripts:
        - scripts/docs_api.py
  - mkdocstrings:
      handlers:
        python:
          paths: [bindings/python/warm-sdk, .docs-gen/pyi]
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            members_order: source
            heading_level: 2
            show_if_no_docstring: true
            inherited_members: false
  - search:
      separator: '[\s\-_/.]+'
  - meta
  - awesome-nav:
      logs:
        no_matches: info
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true
      js_files: [javascripts/warm.js, javascripts/demo.js]

hooks:
  - scripts/docs_hooks.py
  - scripts/docs_site.py

extra_javascript:
  - javascripts/warm.js
  - javascripts/demo.js

# Pages that are session logs or experiment protocols. They stay in the repository; links to them
# from the site resolve to the file on GitHub (scripts/docs_hooks.py). _data and overrides are
# build inputs, not pages.
exclude_docs: |
  migrations/
  PREREGISTRATION-*.md
  research/
  requirements.txt
  versions.json
  _data/
  overrides/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/writerslogic/warm
      name: GitHub
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/writerslogic-warm
      name: crates.io
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/writerslogic-warm-sdk/
      name: PyPI
