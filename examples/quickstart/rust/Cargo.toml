[package]
name = "warm-quickstart"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "warm-quickstart"

# Detached from the library workspace on purpose: it depends on the library by path, exactly as
# a downstream crate would depend on it, and pulls in SQLite for the FTS5 comparison.
[workspace]

[dependencies]
writerslogic-warm = { package = "warm-rust", path = "../../..", features = ["security"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
