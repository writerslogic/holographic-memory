[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "warm-mcp"
version = "0.1.5"
description = "Launcher for the WARM MCP server (warm-mcp): private, on-device persistent memory for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "WritersLogic, Inc.", email = "david@writerslogic.com" }]
keywords = ["mcp", "model-context-protocol", "memory", "agent-memory", "local-first"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://writerslogic.com/warm/"
Documentation = "https://writerslogic.com/warm/docs/latest/integrations/mcp/"
Repository = "https://github.com/writerslogic/warm"

[project.scripts]
warm-mcp = "writerslogic_warm_mcp:main"
writerslogic-warm-mcp = "writerslogic_warm_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/writerslogic_warm_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/writerslogic_warm_mcp", "README.md", "LICENSE"]
