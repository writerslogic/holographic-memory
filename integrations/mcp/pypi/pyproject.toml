[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "holographic-memory-mcp"
version = "0.1.0"
description = "Launcher for the Holographic Memory MCP server (hms-mcp): private, on-device persistent memory for AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "WritersLogic, Inc.", email = "david@writerslogic.com" }]
keywords = ["mcp", "model-context-protocol", "memory", "agent-memory", "local-first"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/writerslogic/holographic-memory/tree/main/docs/integrations/mcp"
Repository = "https://github.com/writerslogic/holographic-memory"

[project.scripts]
holographic-memory-mcp = "holographic_memory_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/holographic_memory_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/holographic_memory_mcp", "README.md", "LICENSE"]
